packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@reown/appkit': false
  bigint-buffer: true
  bufferutil: true
  core-js: false
  esbuild: true
  keccak: false
  nx: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1146.0'
  - '@sentry/browser-utils@11.4.0'
  - '@sentry/browser@11.4.0'
  - '@sentry/bundler-plugins@11.4.0'
  - '@sentry/core@11.4.0'
  - '@sentry/feedback@11.4.0'
  - '@sentry/nextjs@11.4.0'
  - '@sentry/node@11.4.0'
  - '@sentry/opentelemetry@11.4.0'
  - '@sentry/react@11.4.0'
  - '@sentry/replay-canvas@11.4.0'
  - '@sentry/replay@11.4.0'
  - '@sentry/server-runtime-injection@11.4.0'
  - '@sentry/server-utils@11.4.0'
  - '@sentry/vercel-edge@11.4.0'
  - posthog-js@1.435.8
  - '@privy-io/are-addresses-equal@0.0.14'
  - '@privy-io/encoding@0.4.0'
  - '@privy-io/ethereum@0.2.5'
  - '@privy-io/js-sdk-core@0.78.0'
  - '@privy-io/react-auth@3.47.0'
  - '@privy-io/routes@0.4.3'
  - '@privy-io/std@0.0.2'
