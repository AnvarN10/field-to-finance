packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  nx: true
  utf-8-validate: true
minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1146.0'
  - '@sentry/bundler-plugins@11.4.0'
  - '@sentry/core@11.4.0'
  - '@sentry/node@11.4.0'
  - '@sentry/opentelemetry@11.4.0'
  - '@sentry/server-runtime-injection@11.4.0'
  - '@sentry/server-utils@11.4.0'
