[package]
name = "f2f"
version = "0.1.0"
description = "Field-to-Finance program"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "f2f"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }
spl-token-metadata-interface = "1.0.1"

[dev-dependencies]
litesvm = "0.17.0"
solana-message = "4.6.0"
solana-transaction = { version = "4.3.0", features = ["verify"] }
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
spl-associated-token-account-interface = "2.0.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
